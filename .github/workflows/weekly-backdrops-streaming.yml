### GENERATION AUTOMATIQUE DES LOGOS DE STREAMING (HEBDOMADAIRE) ###
name: Weekly Streaming Backdrops

on:
  schedule:
    - cron: "0 4 * * 0" # Tous les dimanches à 4h00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate-streaming-backdrops:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests

      - name: Run Background Generation Engine
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          # 1. NETFLIX
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Netflix" --accent-color "#E50914" --tmdb-request "movie:with_companies=420" --tmdb-request "series:with_networks=213" --output "Ressources/Collections Covers/Streaming Services/Backdrops/netflix.jpg"

          # 2. AMAZON PRIME VIDEO
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Prime Video" --accent-color "#1A92F4" --tmdb-request "movie:with_companies=20580" --tmdb-request "series:with_networks=1024" --output "Ressources/Collections Covers/Streaming Services/Backdrops/primevideo.jpg"

          # 3. DISNEY+
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Disney Plus" --accent-color "#02346C" --tmdb-request "movie:with_companies=2" --tmdb-request "series:with_networks=2739" --output "Ressources/Collections Covers/Streaming Services/Backdrops/disneyplus.jpg"

          # 4. APPLE TV+
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Apple TV" --accent-color "#2D2D2D" --tmdb-request "movie:with_companies=184564" --tmdb-request "series:with_networks=2552" --output "Ressources/Collections Covers/Streaming Services/Backdrops/appletv.jpg"

          # 5. CRUNCHYROLL
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Crunchyroll" --accent-color "#DF5A15" --tmdb-request "movie:with_companies=12417" --tmdb-request "series:with_networks=1112" --output "Ressources/Collections Covers/Streaming Services/Backdrops/crunchyroll.jpg"

          # 6. HBO MAX / MAX
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "HBO Max" --accent-color "#0A183D" --tmdb-request "movie:with_companies=3268" --tmdb-request "series:with_networks=3186" --output "Ressources/Collections Covers/Streaming Services/Backdrops/hbomax.jpg"

          # 7. PARAMOUNT+
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Paramount" --accent-color "#0054E6" --tmdb-request "movie:with_companies=4" --tmdb-request "series:with_networks=4330" --output "Ressources/Collections Covers/Streaming Services/Backdrops/paramount.jpg"

          # 8. HULU
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Hulu" --accent-color "#1CE783" --tmdb-request "movie:with_companies=23217" --tmdb-request "series:with_networks=453" --output "Ressources/Collections Covers/Streaming Services/Backdrops/hulu.jpg"

          # 9. PEACOCK
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Peacock" --accent-color "#000000" --tmdb-request "movie:with_companies=33682" --tmdb-request "series:with_networks=3353" --output "Ressources/Collections Covers/Streaming Services/Backdrops/peacock.jpg"

          # 10. SHUDDER
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Shudder" --accent-color "#990000" --tmdb-request "movie:with_keywords=9748|3640" --tmdb-request "series:with_keywords=9748|3640" --output "Ressources/Collections Covers/Streaming Services/Backdrops/shudder.jpg"

      - name: Clean Python cache folders
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +

      - name: Commit and push updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add "Ressources/Collections Covers/Streaming Services/Backdrops/"
          
          if ! git diff --cached --exit-code --quiet; then
            git commit -m "chore: update streaming platforms backdrops with premium style [skip ci]"
            git push origin main
          else
            echo "No changes found. Skipping commit."
          fi
