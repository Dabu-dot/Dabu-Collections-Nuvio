### GENERATION AUTOMATIQUE DES LOGOS DE STREAMING (HEBDOMADAIRE) ###
name: Weekly Streaming Backdrops

on:
  schedule:
    - cron: "0 5 * * 0" # Tous les dimanches Ã  4h00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate-streaming-backdrops:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests

      - name: Run Background Generation Engine
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          # 1. NETFLIX
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Netflix" --output "Ressources/Collections Covers/Streaming Services/Backdrops/netflix.jpg"

          # 2. AMAZON PRIME VIDEO
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Prime Video" --output "Ressources/Collections Covers/Streaming Services/Backdrops/primevideo.jpg"

          # 3. DISNEY PLUS
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Disney Plus" --output "Ressources/Collections Covers/Streaming Services/Backdrops/disneyplus.jpg"

          # 4. HBO MAX
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "HBO Max" --output "Ressources/Collections Covers/Streaming Services/Backdrops/hbomax.jpg"

          # 5. APPLE TV
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Apple TV" --output "Ressources/Collections Covers/Streaming Services/Backdrops/appletv.jpg"

          # 6. CRUNCHYROLL
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Crunchyroll" --output "Ressources/Collections Covers/Streaming Services/Backdrops/crunchyroll.jpg"

          # 7. PARAMOUNT
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Paramount" --output "Ressources/Collections Covers/Streaming Services/Backdrops/paramount.jpg"

          # 8. HULU
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Hulu" --output "Ressources/Collections Covers/Streaming Services/Backdrops/hulu.jpg"

          # 9. PEACOCK
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Peacock" --output "Ressources/Collections Covers/Streaming Services/Backdrops/peacock.jpg"

          # 10. SHUDDER
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Shudder" --output "Ressources/Collections Covers/Streaming Services/Backdrops/shudder.jpg"

          # 11. MUBI
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Mubi" --output "Ressources/Collections Covers/Streaming Services/Backdrops/mubi.jpg"

          # 12. CANAL+
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Canal+" --output "Ressources/Collections Covers/Streaming Services/Backdrops/canalplus.jpg"

          # 13. SKYSHOWTIME
          python3 -B .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "SkyShowtime" --output "Ressources/Collections Covers/Streaming Services/Backdrops/skyshowtime.jpg"

      - name: Clean Python cache folders
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +

      - name: Commit and push updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add "Ressources/Collections Covers/Streaming Services/Backdrops/"
          
          if ! git diff --cached --exit-code --quiet; then
            git commit -m "chore: auto-update premium streaming backdrops [skip ci]"
            git push origin main
          else
            echo "No changes detected in backdrops assets. Skipping commit."
          fi
