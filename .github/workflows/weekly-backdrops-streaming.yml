### GENERATION AUTOMATIQUE DES LOGOS DE STREAMING (HEBDOMADAIRE) ###
name: Weekly Streaming Backdrops

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-streaming-backdrops:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Run Background Generation Engine
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          # Exemple pour Netflix, reproduire pour chaque plateforme
          python3 .github/scripts/backdrop-streaming.py --api-key "$TMDB_API_KEY" --label "Netflix" --output "Ressources/Collections Covers/Streaming Services/Backdrops/netflix.jpg"

      - name: Commit and push updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Ajout du dossier complet incluant les images et le JSON[span_6](start_span)[span_6](end_span)
          git add "Ressources/Collections Covers/Streaming Services/Backdrops/"
          
          if ! git diff --cached --exit-code --quiet; then
            git commit -m "chore: auto-update premium streaming backdrops and grid history [skip ci]"
            git push origin main
          else
            echo "No changes detected. Skipping."
          fi
          
