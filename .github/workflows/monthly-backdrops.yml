name: Generate Collections Covers

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'onglet Actions

permissions:
  contents: write # Crucial pour autoriser le push des images générées

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/checkout@v4
      # Note: Si tu utilises une version spécifique ou setup-python, garde ta configuration.
      # Ici on s'assure juste de récupérer le code du repo.

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Ajoute ici tes dépendances spécifiques (requests, pillow, etc.) si elles ne sont pas dans un requirements.txt

    - name: Run generation script
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }} # Ajuste avec le nom exact de tes secrets si nécessaire
        FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
      run: |
        # C'est ici que ton script s'exécute et crée les images dans "Ressources/Collections Covers/Genres/"
        python ton_script_de_generation.py

    - name: Commit and Push generated backdrops
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # On force l'ajout de tout ce qui a été créé dans le dossier des genres
        git add "Ressources/Collections Covers/Genres/"
        
        # On vérifie s'il y a des changements pour éviter de faire planter le workflow s'il n'y a rien de neuf
        if ! git diff --cached --exit-code --quiet; then
          git commit -m "Chore: Auto-generate covers and backdrops [skip ci]"
          git push origin main
        else
          echo "Aucune nouvelle image à ajouter, le dossier est déjà à jour."
        fi
