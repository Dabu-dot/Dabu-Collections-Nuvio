name: Monthly Backdrops

on:
  schedule:
    - cron: "0 4 1 * *" # Tourne le 1er de chaque mois
  workflow_dispatch:   # Te permet de le lancer à la main depuis l'onglet Actions

permissions:
  contents: write

jobs:
  generate-backdrops:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests

      - name: Generate Genres Backdrops
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
        run: |
          # --- GENRE : ACTION ---
          python3 -B .github/scripts/backdrop.py \
            --api-key "$TMDB_API_KEY" \
            --fanart-key "$FANART_API_KEY" \
            --label "Action" \
            --tmdb-request "with_genres=28&sort_by=popularity.desc" \
            --output "Ressources/Collections Covers/Genres/action.jpg" \
            --profile compressed \
            --size 1080p

          # --- GENRE : SCIENCE-FICTION ---
          python3 -B .github/scripts/backdrop.py \
            --api-key "$TMDB_API_KEY" \
            --fanart-key "$FANART_API_KEY" \
            --label "Sci-Fi" \
            --tmdb-request "with_genres=878&sort_by=popularity.desc" \
            --output "Ressources/Collections Covers/Genres/scifi.jpg" \
            --profile compressed \
            --size 1080p

          # Tu peux dupliquer ce bloc pour chaque genre en changeant l'ID de genre TMDB (with_genres) et le chemin de sortie (--output) !

      - name: Clean Python cache folders
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +

      - name: Commit and push updated assets
        id: publish
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Ressources/Collections Covers/Genres/"
          git commit -m "chore: refresh monthly backdrops"
          git push
