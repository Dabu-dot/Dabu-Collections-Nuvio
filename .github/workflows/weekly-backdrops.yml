name: Weekly Backdrops Generation

on:
  schedule:
    - cron: '0 4 * * 0' # Tous les dimanches à 4:00 AM UTC
  workflow_dispatch: # Permet le déclenchement manuel depuis l'onglet Actions

jobs:
  generate-backdrops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run Backdrops Matrix Generation
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python backdrop.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Ressources/Collections Covers/Genres/Weekly Backdrops/*" || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update weekly grid backdrops [skip ci]" && git push)
