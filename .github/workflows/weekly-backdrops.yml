name: Weekly Backdrops

on:
  schedule:
    - cron: "0 4 * * 0" # Automatisation complète chaque dimanche à 4h00 UTC
  workflow_dispatch: # Permet de forcer manuellement le run depuis GitHub

permissions:
  contents: write

jobs:
  generate-backdrops:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests

      - name: Generate Genres Backdrops
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== [START] Lancement de la matrice des backdrops de genres ==="
          python3 .github/scripts/backdrop.py
          echo "=== [END] Fin de la génération ==="

      - name: Commit and push updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Ajout strict des fichiers du dossier Genres racine (sans le sous-dossier inutile)
          git add "Ressources/Collections Covers/Genres/*.jpg" "Ressources/Collections Covers/Genres/*.webp"
          
          if ! git diff --cached --exit-code --quiet; then
            git commit -m "chore: refresh weekly tilted genres backdrops [skip ci]"
            git push origin main
          else
            echo "Aucun changement détecté dans la structure graphique."
          fi
