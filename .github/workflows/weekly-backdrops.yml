name: Weekly Backdrops

on:
  schedule:
    - cron: "0 4 * * 0" # Exécution automatique tous les dimanches à 4h00 UTC
  workflow_dispatch: # Déclenchement manuel

permissions:
  contents: write

jobs:
  generate-backdrops:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests

      - name: Generate Genres Backdrops
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PYTHONUNBUFFERED: "1" # Force l'affichage immédiat des prints Python dans les logs
        run: |
          echo "=== [START] Lancement du script de génération globale ==="
          python3 .github/scripts/backdrop.py
          echo "=== [END] Fin d'exécution du script Python ==="

      - name: Commit and push updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Cible le dossier configuré dans le script backdrop.py
          git add "Ressources/Collections Covers/Genres/Weekly Backdrops/*"
          
          if ! git diff --cached --exit-code --quiet; then
            git commit -m "chore: refresh weekly genres backdrops [skip ci]"
            git push origin main
          else
            echo "Aucune modification détectée dans les images."
          fi
