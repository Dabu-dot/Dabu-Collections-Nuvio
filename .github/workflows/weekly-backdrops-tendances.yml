### GENERATION AUTOMATIQUE DU BACKDROP "TENDANCES CETTE SEMAINE" (HEBDOMADAIRE) ###
name: Weekly Tendances Backdrop

on:
  schedule:
    - cron: "0 5 * * 1" # Tous les lundis à 6h00 heure française d'hiver (5h00 UTC), décalé des autres workflows du dimanche
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate-tendances-backdrop:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests

      - name: Generate Tendances podium
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 -B .github/scripts/backdrop-tendances.py --api-key "$TMDB_API_KEY" --output "Ressources/Collections Covers/Discover/Backdrops/trending.jpg"

      - name: Clean Python cache folders
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +

      - name: Commit and push updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Ressources/Collections Covers/Discover/Backdrops/"

          if ! git diff --cached --exit-code --quiet; then
            git commit -m "chore: refresh weekly Tendances podium backdrop [skip ci]"

            # Récupération sécurisée des modifications distantes avant le push
            git pull --rebase origin main

            git push origin main
          else
            echo "No changes detected in Tendances backdrop. Skipping commit."
          fi
