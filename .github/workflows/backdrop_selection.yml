name: Backdrop Selection Generator

on:
  schedule:
    - cron: '0 5 * * *' # Déclenchement automatique tous les jours à 05h00 UTC
  workflow_dispatch: # Autorise un lancement manuel depuis l'onglet Actions sur GitHub

permissions:
  contents: write

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pillow

    - name: Download Apple San Francisco Font
      run: |
        mkdir -p .github/assets/fonts
        # Téléchargement sécurisé de la police SF Pro Display Bold
        curl -sL "https://github.com/AndrewFontenot/SF-Pro-Fonts/raw/master/SF-Pro-Display-Bold.otf" -o .github/assets/fonts/SF-Pro-Display-Bold.otf

    - name: Execute Backdrop Renderer
      env:
        BINGECAT_CATALOG_URL: ${{ secrets.BINGECAT_CATALOG_URL }}
      run: python .github/scripts/backdrop_selection.py

    - name: Commit and Push Backdrop
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add Ressources/backdrops/
        if ! git diff-index --quiet HEAD; then
          git commit -m "🎨 Update backdrop_selection : $(date +'%Y-%m-%d')"
          git push
        else
          echo "Aucune modification de contenu détectée aujourd'hui."
        fi
