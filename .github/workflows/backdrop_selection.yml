name: Backdrop Selection Generator

on:
  schedule:
    - cron: "0 5 * * *"  # S'exécute automatiquement tous les jours à 5h00 UTC
  workflow_dispatch:      # Permet un déclenchement manuel depuis l'interface GitHub

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests

      - name: Execute Backdrop Renderer
        env:
          BINGECAT_FILMS_URL: ${{ secrets.BINGECAT_FILMS_URL }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 .github/scripts/backdrop_selection.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Indexation globale du dossier de sortie (gère toutes les images d'un coup)
          git add "Ressources/backdrops/"
          
          # Push uniquement s'il y a des changements visuels dans les sélections
          if ! git diff --cached --exit-code; then
            git commit -m "🎨 Update backdrop_selections : $(date +'%Y-%m-%d') [Skip CI]"
            git push origin main
          else
            echo "Aucun changement visuel détecté aujourd'hui."
          fi
