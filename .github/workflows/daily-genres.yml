name: Daily Genres Posters

on:
  schedule:
    - cron: '0 4 * * *' # Exécution quotidienne à 4h00 UTC
  workflow_dispatch: # Permet le lancement manuel pour tes tests

jobs:
  generate-covers:
    runs-on: ubuntu-latest
    
    # AJOUT ICI : Autorise explicitement l'action à écrire dans le dépôt
    permissions:
      contents: write
    
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation des dépendances système (OpenCV / Graphics)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances Python (Traitement Image + IA)
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy mtcnn tensorflow-cpu

      - name: Exécution du générateur de posters
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python .github/scripts/posters-genres.py

      - name: Mise à jour du dépôt (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add "Ressources/Collections Covers/Genres/Static Covers/"
          
          if ! git diff --staged --quiet; then
            git commit -m "UI: Mise à jour automatique des posters de genre"
            git push
          else
            echo "Aucun changement détecté, pas de commit."
          fi
          
