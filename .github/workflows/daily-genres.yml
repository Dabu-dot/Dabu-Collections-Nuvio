name: Daily Genres Posters Generator

on:
  schedule:
    - cron: "0 5 * * *"  # Tous les jours à 5h00 UTC
  workflow_dispatch:      # Permet un déclenchement manuel depuis l'interface GitHub

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate-posters:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests numpy

      - name: Run Posters Generator
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 .github/scripts/posters-genres.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Indexation des bannières générées et de l'historique de rotation
          git add "Ressources/Collections Covers/Genres/Static Covers/"
          git add ".github/scripts/posters_history.json"
          
          if ! git diff --cached --exit-code; then
            git commit -m "Changement quotidien automatique des posters de genres"
            git push origin main
          else
            echo "Aucun changement détecté, skip push."
          fi
